<!doctype html>
<html lang="hu">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <title>Pethő Travel – Sofőr demó</title>
    <style>
      :root {
        --ink: #172033;
        --muted: #667085;
        --line: #dce3ee;
        --soft: #f3f6fb;
        --card: #ffffff;
        --brand: #155eef;
        --brand-strong: #0b4dd8;
        --brand-soft: #eaf1ff;
        --green: #067647;
        --green-soft: #e8f7ef;
        --amber: #b54708;
        --amber-soft: #fff3e0;
        --red: #b42318;
        --red-soft: #ffeded;
        --shadow: 0 8px 24px rgba(16, 24, 40, 0.08);
        --shadow-lg: 0 24px 70px rgba(16, 24, 40, 0.22);
      }
      * { box-sizing: border-box; }
      html { background: #e9eef6; }
      body { margin: 0; color: var(--ink); background: #e9eef6; font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      button, input, select, textarea { font: inherit; }
      button { color: inherit; }
      button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid rgba(21,94,239,.28); outline-offset: 2px; }
      .app { width: min(100%, 720px); min-height: 100dvh; margin: 0 auto; background: var(--soft); box-shadow: 0 0 0 1px rgba(16,24,40,.05); }
      .demo-banner { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 34px; padding: 6px 16px; color: #344054; background: #fff6d9; border-bottom: 1px solid #f3d98b; font-size: 12px; font-weight: 700; letter-spacing: .02em; }
      .appbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 70px; padding: 12px 18px; color: #fff; background: linear-gradient(135deg, #0b4dd8, #1970f6); box-shadow: 0 4px 14px rgba(15, 76, 205, .22); }
      .brandline { margin: 0 0 2px; color: #bed2ff; font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
      .appbar h1 { margin: 0; font-size: 20px; line-height: 1.2; }
      .date { margin: 3px 0 0; color: #dbe7ff; font-size: 13px; }
      .header-actions { display: flex; gap: 8px; }
      .icon-button { display: inline-grid; place-items: center; width: 44px; height: 44px; border: 0; border-radius: 14px; color: inherit; background: rgba(255,255,255,.14); cursor: pointer; }
      .icon-button:hover { background: rgba(255,255,255,.22); }
      .content { padding: 16px 16px 104px; }
      .section { margin-top: 20px; }
      .section:first-child { margin-top: 0; }
      .section-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 0 0 10px; }
      .section-head h2, .eyebrow { margin: 0; color: #667799; font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
      .section-link { min-height: 40px; padding: 0 4px; border: 0; color: var(--brand); background: transparent; font-size: 13px; font-weight: 750; cursor: pointer; }
      .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
      .stat { padding: 14px; border: 1px solid var(--line); border-radius: 16px; background: var(--card); box-shadow: 0 3px 12px rgba(16,24,40,.04); }
      .stat-label { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; }
      .stat strong { display: block; margin-top: 6px; font-size: 18px; font-variant-numeric: tabular-nums; }
      .card { border: 1px solid var(--line); border-radius: 20px; background: var(--card); box-shadow: var(--shadow); }
      .hero { overflow: hidden; }
      .hero-body { padding: 18px; }
      .hero-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
      .time { font-size: 34px; line-height: 1; font-weight: 850; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
      .badge { display: inline-flex; align-items: center; min-height: 26px; padding: 4px 9px; border-radius: 999px; font-size: 11px; font-weight: 800; white-space: nowrap; }
      .badge.blue { color: #1849a9; background: var(--brand-soft); }
      .badge.green { color: var(--green); background: var(--green-soft); }
      .badge.amber { color: var(--amber); background: var(--amber-soft); }
      .badge.gray { color: #475467; background: #eef2f7; }
      .route { margin: 12px 0 4px; font-size: 19px; font-weight: 800; letter-spacing: -.02em; }
      .meta { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
      .flight { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; margin-top: 14px; padding: 11px 12px; border: 1px solid #c9d8fb; border-radius: 14px; background: #f6f8ff; }
      .flight strong { display: block; font-size: 13px; }
      .flight small { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; }
      .delay { color: var(--amber); font-size: 12px; font-weight: 800; text-align: right; }
      .button-row { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 14px; }
      .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 13px; color: #344054; background: #fff; font-size: 14px; font-weight: 800; cursor: pointer; }
      .btn:hover { background: #f8fafc; }
      .btn.primary { border-color: var(--brand); color: #fff; background: var(--brand); }
      .btn.primary:hover { background: var(--brand-strong); }
      .btn.success { border-color: #079455; color: #fff; background: #079455; }
      .btn.danger { border-color: #fecdca; color: var(--red); background: var(--red-soft); }
      .btn.ghost { border-color: transparent; background: transparent; }
      .btn:disabled { opacity: .5; cursor: not-allowed; }
      .primary-action { width: 100%; min-height: 58px; border: 0; border-radius: 0 0 18px 18px; color: #fff; background: linear-gradient(135deg, #c25f0c, #df7c17); font-size: 16px; font-weight: 850; cursor: pointer; }
      .primary-action.done { background: linear-gradient(135deg, #067647, #12a166); }
      .alert { display: flex; align-items: flex-start; gap: 11px; padding: 13px 14px; border: 1px solid #fedf89; border-radius: 15px; color: #7a2e0e; background: #fffaeb; }
      .alert strong { display: block; margin-bottom: 2px; font-size: 13px; }
      .alert p { margin: 0; font-size: 12px; line-height: 1.45; }
      .alert .section-link { margin-left: auto; color: #93370d; }
      .day-strip { display: grid; grid-template-columns: repeat(7,1fr); gap: 5px; padding: 7px; border: 1px solid var(--line); border-radius: 17px; background: #fff; }
      .day { min-height: 58px; padding: 6px 2px; border: 0; border-radius: 12px; color: #667085; background: transparent; cursor: pointer; }
      .day span { display: block; font-size: 10px; font-weight: 800; text-transform: uppercase; }
      .day strong { display: block; margin-top: 5px; font-size: 15px; }
      .day.active { color: #1849a9; background: var(--brand-soft); }
      .day .dot { width: 5px; height: 5px; margin: 4px auto 0; border-radius: 50%; background: var(--brand); }
      .trip-list { overflow: hidden; border: 1px solid var(--line); border-radius: 18px; background: #fff; }
      .trip-row { display: grid; grid-template-columns: 54px 1fr auto; align-items: center; gap: 10px; width: 100%; min-height: 84px; padding: 12px 14px; border: 0; border-bottom: 1px solid var(--line); background: transparent; text-align: left; cursor: pointer; }
      .trip-row:last-child { border-bottom: 0; }
      .trip-row:hover { background: #f8faff; }
      .trip-time { font-weight: 850; font-variant-numeric: tabular-nums; }
      .trip-main { min-width: 0; }
      .trip-label { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
      .trip-route { overflow: hidden; font-size: 14px; font-weight: 800; text-overflow: ellipsis; white-space: nowrap; }
      .trip-meta { overflow: hidden; margin-top: 4px; color: var(--muted); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
      .chevron { color: #98a2b3; }
      .toolbar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
      .filter { flex: 0 0 auto; min-height: 40px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 999px; color: #475467; background: #fff; font-size: 12px; font-weight: 750; cursor: pointer; }
      .filter.active { border-color: #84aefb; color: #1849a9; background: var(--brand-soft); }
      .disclosure { overflow: hidden; margin-bottom: 10px; border: 1px solid var(--line); border-radius: 17px; background: #fff; }
      .disclosure-head { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 10px; width: 100%; min-height: 66px; padding: 12px 14px; border: 0; background: transparent; text-align: left; cursor: pointer; }
      .disclosure-head strong { display: block; font-size: 14px; }
      .disclosure-head small { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; }
      .amount { font-size: 14px; font-weight: 850; font-variant-numeric: tabular-nums; white-space: nowrap; }
      .disclosure-body { padding: 0 14px 14px; border-top: 1px solid #edf0f5; }
      .description-list { margin: 0; }
      .description-row { display: grid; grid-template-columns: 1fr auto; gap: 12px; padding: 11px 0; border-bottom: 1px solid #edf0f5; }
      .description-row:last-child { border-bottom: 0; }
      .description-row dt { color: var(--muted); font-size: 12px; }
      .description-row dd { margin: 0; font-size: 12px; font-weight: 750; text-align: right; }
      .counter { display: inline-grid; grid-template-columns: 42px minmax(44px,auto) 42px; align-items: center; overflow: hidden; border: 1px solid var(--line); border-radius: 12px; }
      .counter button { min-height: 42px; border: 0; color: var(--brand); background: #f6f8fc; font-size: 18px; cursor: pointer; }
      .counter strong { padding: 0 10px; text-align: center; font-variant-numeric: tabular-nums; }
      .form-grid { display: grid; gap: 12px; margin-top: 12px; }
      label { display: grid; gap: 6px; color: #475467; font-size: 12px; font-weight: 750; }
      input, select, textarea { width: 100%; min-height: 46px; padding: 10px 12px; border: 1px solid #cfd8e6; border-radius: 12px; color: var(--ink); background: #fff; font-size: 16px; }
      textarea { min-height: 88px; resize: vertical; }
      .summary { overflow: hidden; border: 1px solid #bad7c7; border-radius: 18px; background: #f3fcf7; }
      .summary-row { display: flex; justify-content: space-between; gap: 12px; padding: 12px 14px; border-bottom: 1px solid #d7ecdf; font-size: 13px; }
      .summary-row:last-child { border-bottom: 0; }
      .summary-row.total { color: var(--green); font-size: 16px; font-weight: 850; }
      .vehicle-selector { display: grid; grid-template-columns: 46px 1fr auto; align-items: center; gap: 10px; padding: 14px; }
      .vehicle-icon { display: grid; place-items: center; width: 46px; height: 46px; border-radius: 14px; color: var(--brand); background: var(--brand-soft); }
      .vehicle-selector select { min-height: 40px; padding: 7px 34px 7px 9px; border-color: transparent; background-color: transparent; font-size: 14px; font-weight: 800; }
      .progress { height: 8px; overflow: hidden; border-radius: 99px; background: #e9eef5; }
      .progress > span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg,#155eef,#53b1fd); }
      .issue { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: start; padding: 14px; border-bottom: 1px solid var(--line); }
      .issue:last-child { border-bottom: 0; }
      .issue-icon { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 12px; background: var(--amber-soft); }
      .issue strong { display: block; font-size: 13px; }
      .issue p { margin: 4px 0 0; color: var(--muted); font-size: 11px; }
      .message { display: grid; grid-template-columns: auto 1fr auto; gap: 11px; width: 100%; min-height: 88px; padding: 14px; border: 0; border-bottom: 1px solid var(--line); background: #fff; text-align: left; cursor: pointer; }
      .message:last-child { border-bottom: 0; }
      .message.unread { background: #f5f8ff; }
      .avatar { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 50%; color: #1849a9; background: #dbe7ff; font-size: 12px; font-weight: 850; }
      .message strong { display: block; font-size: 13px; }
      .message p { display: -webkit-box; overflow: hidden; margin: 4px 0 0; color: var(--muted); font-size: 12px; line-height: 1.4; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
      .unread-dot { width: 9px; height: 9px; margin-top: 7px; border-radius: 50%; background: var(--brand); }
      .empty { padding: 28px 18px; text-align: center; }
      .empty-icon { display: grid; place-items: center; width: 52px; height: 52px; margin: 0 auto 12px; border-radius: 50%; color: var(--brand); background: var(--brand-soft); }
      .empty strong { display: block; }
      .empty p { margin: 6px 0 0; color: var(--muted); font-size: 12px; }
      .bottom-nav { position: fixed; z-index: 25; right: 0; bottom: 0; left: 0; display: grid; grid-template-columns: repeat(5,1fr); width: min(100%,720px); min-height: 76px; margin: 0 auto; padding: 8px max(8px, env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left)); border-top: 1px solid var(--line); background: rgba(255,255,255,.96); backdrop-filter: blur(14px); box-shadow: 0 -8px 24px rgba(16,24,40,.08); }
      .nav-item { position: relative; display: grid; justify-items: center; align-content: center; gap: 4px; min-height: 56px; border: 0; border-radius: 12px; color: #667085; background: transparent; font-size: 10px; font-weight: 750; cursor: pointer; }
      .nav-item.active { color: var(--brand); background: var(--brand-soft); }
      .nav-badge { position: absolute; top: 3px; left: calc(50% + 8px); display: grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px; border: 2px solid #fff; border-radius: 99px; color: #fff; background: var(--red); font-size: 9px; }
      .overlay { position: fixed; z-index: 80; inset: 0; display: flex; align-items: flex-end; justify-content: center; padding: 16px 16px max(16px,env(safe-area-inset-bottom)); background: rgba(15,23,42,.5); backdrop-filter: blur(4px); }
      .sheet { width: min(100%, 620px); max-height: min(88dvh,800px); overflow: auto; border-radius: 24px; background: #fff; box-shadow: var(--shadow-lg); animation: rise .2s ease-out; }
      @keyframes rise { from { transform: translateY(18px); opacity: .5; } }
      .sheet-head { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 66px; padding: 14px 16px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.97); }
      .sheet-head::before { position: absolute; top: 7px; left: calc(50% - 20px); width: 40px; height: 4px; border-radius: 99px; background: #d7deea; content: ""; }
      .sheet-head h2 { margin: 7px 0 0; font-size: 16px; }
      .sheet-body { padding: 16px; }
      .close { display: grid; place-items: center; width: 40px; height: 40px; border: 1px solid var(--line); border-radius: 12px; color: #667085; background: #fff; cursor: pointer; }
      .passenger { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 11px; padding: 13px 0; border-bottom: 1px solid var(--line); }
      .passenger:last-child { border-bottom: 0; }
      .passenger strong { display: block; font-size: 13px; }
      .passenger small { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; }
      .toast { position: fixed; z-index: 120; right: 16px; bottom: 92px; left: 16px; width: min(calc(100% - 32px), 600px); margin: 0 auto; padding: 13px 15px; border-radius: 14px; color: #fff; background: #101828; box-shadow: var(--shadow-lg); font-size: 13px; font-weight: 750; animation: rise .2s ease-out; }
      .hidden { display: none !important; }
      .spacer { height: 6px; }
      @media (min-width: 721px) {
        .app { border-right: 1px solid #d8e0eb; border-left: 1px solid #d8e0eb; }
        .content { padding: 22px 24px 110px; }
        .overlay { align-items: center; }
        .sheet { border-radius: 24px; }
      }
      @media (max-width: 380px) {
        .content { padding-right: 12px; padding-left: 12px; }
        .hero-body { padding: 15px; }
        .time { font-size: 30px; }
        .button-row { grid-template-columns: 1fr; }
        .trip-row { grid-template-columns: 47px 1fr auto; padding-right: 10px; padding-left: 10px; }
        .nav-item { font-size: 9px; }
      }
    </style>
  </head>
  <body>
    <div id="app" class="app"></div>
    <div id="modal-root"></div>
    <div id="toast-root" aria-live="polite"></div>
    <script>
      const SEED = {

      };

      const initialState = {
        tab: 'today', modal: null, openReports: ['t1'], reportStatus: 'draft',
        tripStatus: { t1:'assigned', t2:'later', t3:'later', t4:'later' },
        carpoolCounts: { t2:6, t4:null }, costs: SEED.costs, packageIncome: SEED.packageIncome,

      function clone(value) { return JSON.parse(JSON.stringify(value)); }
      function loadState() {
        try { return { ...clone(initialState), ...JSON.parse(localStorage.getItem('driver-demo-v1') || '{}') }; }
        catch { return clone(initialState); }
      }
      let state = loadState();
      let toastTimer;
      const app = document.getElementById('app');
      const modalRoot = document.getElementById('modal-root');
      const toastRoot = document.getElementById('toast-root');

      const icons = {
        today:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M7 3v3M17 3v3M4 9h16M5 5h14a1 1 0 0 1 1 1v14H4V6a1 1 0 0 1 1-1Z"/><path d="m9 15 2 2 4-5"/></svg>',
        report:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v5h5M10 13h5M10 17h5"/></svg>',
        vehicle:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="m4 16 1-6 2-3h10l2 3 1 6v3h-2v-2H6v2H4z"/><circle cx="8" cy="14" r="1"/><circle cx="16" cy="14" r="1"/><path d="M6 10h12"/></svg>',
        money:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M3 6h18v13H3z"/><path d="M16 10h5v5h-5a2.5 2.5 0 0 1 0-5ZM7 10h4"/></svg>',
        inbox:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 4h16v16H4z"/><path d="m4 6 8 7 8-7"/></svg>',
        bell:'<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg>',
        more:'<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>',
        chevron:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>',
        close:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 6 12 12M18 6 6 18"/></svg>',
        phone:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2.1Z"/></svg>',
        map:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s7-5 7-12a7 7 0 1 0-14 0c0 7 7 12 7 12Z"/><circle cx="12" cy="9" r="2"/></svg>',
        alert:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3 2 21h20L12 3Z"/><path d="M12 9v5M12 18h.01"/></svg>'
      };

      function huf(value) { return new Intl.NumberFormat('hu-HU').format(value) + ' Ft'; }
      function unreadCount() { return state.messages.filter(m => m.unread).length; }
      function trip(id) { return SEED.trips.find(item => item.id === id); }
      function countFor(item) { return item.type === 'carpool' ? state.carpoolCounts[item.id] : item.count; }
      function tripAmount(item) {
        const count = countFor(item);
        return item.type === 'carpool' ? (count || 0) * 6000 : item.amount;
      }
      function grossTotal() { return SEED.trips.reduce((sum,item) => sum + tripAmount(item), 0) + state.packageIncome; }
      function costTotal() { return state.costs.reduce((sum,item) => sum + Number(item.amount || 0), 0); }
      function cashTotal() { return 45000 + ((state.carpoolCounts.t2 || 0) - 1) * 6000 + state.packageIncome; }
      function statusLabel(id) {
        return ({assigned:'Következő',to_pickup:'Úton a felvételhez',arrived:'Megérkezett',onboard:'Utas felvéve',completed:'Lezárva',later:'Később'})[state.tripStatus[id]] || 'Később';
      }
      function statusButton(id) {
        const value = state.tripStatus[id];
        return ({assigned:'Elindultam a felvételi címre',to_pickup:'Megérkeztem',arrived:'Utas felvéve',onboard:'Fuvar lezárása',completed:'Fuvar lezárva'})[value] || 'Fuvar megnyitása';
      }
      function badgeFor(item) { return item.type === 'carpool' ? 'blue' : item.type === 'airport' ? 'amber' : 'gray'; }
      function save() { localStorage.setItem('driver-demo-v1', JSON.stringify(state)); }
      function showToast(message) {
        state.toast = message; renderToast(); clearTimeout(toastTimer);
        toastTimer = setTimeout(() => { state.toast=''; renderToast(); }, 2800);
      }
      function renderToast() { toastRoot.innerHTML = state.toast ? `<div class="toast">${state.toast}</div>` : ''; }

      function header(title, subtitle) {
        return `<div class="demo-banner">● SZIMULÁLT DEMÓ · NINCS ADATBÁZIS-KAPCSOLAT</div>
          <header class="appbar">
            <div><p class="brandline">Pethő Travel</p><h1>${title}</h1><p class="date">${subtitle}</p></div>
            <div class="header-actions">
              <button class="icon-button" data-action="tab" data-tab="inbox" aria-label="Üzenetek">${icons.bell}</button>
              <button class="icon-button" data-action="open-modal" data-modal="demo" aria-label="Demó beállítások">${icons.more}</button>
            </div>
          </header>`;
      }

      function nav() {
        const items = [['today','Ma'],['report','Menetlevél'],['vehicle','Jármű'],['money','Pénz'],['inbox','Üzenetek']];
        return `<nav class="bottom-nav" aria-label="Fő navigáció">${items.map(([id,label]) => `<button class="nav-item ${state.tab===id?'active':''}" data-action="tab" data-tab="${id}">${icons[id]}<span>${label}</span>${id==='inbox'&&unreadCount()?`<span class="nav-badge">${unreadCount()}</span>`:''}</button>`).join('')}</nav>`;
      }

      function todayView() {
        const current = trip('t1');
        const currentState = state.tripStatus.t1;
        return `${header(`Szia, ${SEED.driver.name}!`, SEED.date)}<main class="content">
          <section class="grid-2">
            <div class="stat"><span class="stat-label">Készpénz ma</span><strong>${huf(cashTotal())}</strong></div>
            <div class="stat"><span class="stat-label">Csomagpénz</span><strong>${huf(state.packageIncome)}</strong></div>
          </section>
          ${!state.reminderDismissed && currentState==='assigned' ? `<section class="section"><div class="alert">${icons.alert}<div><strong>Indulási visszajelzés szükséges</strong><p>A transzfer 45 percen belül kezdődik. Ha már elindultál, jelezd most.</p></div><button class="section-link" data-action="dismiss-reminder">Rendben</button></div></section>` : ''}
          <section class="section"><div class="section-head"><h2>Aktuális út</h2><span class="badge green">● online</span></div>
            <article class="card hero">
              <div class="hero-body">
                <div class="hero-top"><div><div class="time">${current.time}</div><div class="trip-label"><span class="badge ${badgeFor(current)}">${current.label}</span><span class="badge gray">${statusLabel('t1')}</span></div></div><span class="badge blue">${SEED.vehicle.plate}</span></div>
                <p class="route">${current.from} → ${current.to}</p><p class="meta">${current.count} utas · ${current.contact} · ${current.payment}</p>
                <div class="flight"><span>✈</span><div><strong>${current.flight}</strong><small>Érkezés 08:05 helyett 08:40</small></div><span class="delay">${current.flightState}</span></div>
                <div class="button-row"><button class="btn" data-action="simulate" data-message="Navigáció megnyitva a felvételi címhez">${icons.map} Navigáció</button><button class="btn" data-action="open-trip" data-id="t1">Utaslista és részletek</button></div>
              </div>
              <button class="primary-action ${currentState==='completed'?'done':''}" data-action="advance-trip" data-id="t1" ${currentState==='completed'?'disabled':''}>${statusButton('t1')}</button>
            </article>
          </section>
          <section class="section"><div class="section-head"><h2>Heti terv</h2><button class="section-link" data-action="simulate" data-message="A teljes heti nézet megnyitva">Teljes hét →</button></div>
            <div class="day-strip">${[['H',31],['K',1],['Sze',2],['Cs',3],['P',4],['Szo',5],['V',6]].map(([d,n],i)=>`<button class="day ${i===0?'active':''}" data-action="day"><span>${d}</span><strong>${n}</strong>${i<5?'<i class="dot"></i>':''}</button>`).join('')}</div>
          </section>
          <section class="section"><div class="section-head"><h2>Mai napod</h2><span class="badge gray">4 út</span></div>
            <div class="trip-list">${SEED.trips.slice(1).map(tripRow).join('')}</div>
          </section>
        </main>${nav()}`;
      }

      function tripRow(item) {
        const count = countFor(item);
        const meta = item.type === 'carpool'
          ? `${count===null?'Utaslétszám: nincs adat':count+' fő'} · ${count===null?'indulás előtt rögzítendő':huf(tripAmount(item))}`
          : `${item.count} utas · ${item.contact}`;
        return `<button class="trip-row" data-action="open-trip" data-id="${item.id}"><span class="trip-time">${item.time}</span><span class="trip-main"><span class="trip-label"><span class="badge ${badgeFor(item)}">${item.label}</span></span><span class="trip-route">${item.from} → ${item.to}</span><span class="trip-meta">${meta}</span></span><span class="chevron">${icons.chevron}</span></button>`;
      }

      function reportView() {
        return `${header('Napi menetlevél', '2026. augusztus 31. · automatikusan előkészítve')}<main class="content">
          <section class="grid-2"><div class="stat"><span class="stat-label">Fuvarbevétel</span><strong>${huf(grossTotal()-state.packageIncome)}</strong></div><div class="stat"><span class="stat-label">Költségek</span><strong>${huf(costTotal())}</strong></div></section>
          <section class="section"><div class="section-head"><h2>Fuvarok a beosztásból</h2><span class="badge ${state.reportStatus==='submitted'?'green':'amber'}">${state.reportStatus==='submitted'?'Beküldve':'Piszkozat'}</span></div>
            ${SEED.trips.map(reportDisclosure).join('')}
            <div class="button-row"><button class="btn" data-action="open-modal" data-modal="add-trip">+ Fuvar</button><button class="btn" data-action="simulate" data-message="Üres menet hozzáadva">+ Üres menet</button></div>
          </section>
          <section class="section"><div class="section-head"><h2>Csomagpénz</h2><button class="section-link" data-action="open-modal" data-modal="package">+ Bevétel</button></div><div class="card"><div class="description-row" style="padding:14px"><dt>Mai átvétel</dt><dd>${huf(state.packageIncome)}</dd></div></div></section>
          <section class="section"><div class="section-head"><h2>Kiadások</h2><button class="section-link" data-action="open-modal" data-modal="cost">+ Kiadás</button></div><div class="card">${state.costs.length?state.costs.map(c=>`<div class="description-row" style="padding:13px 14px"><dt><strong>${c.type}</strong><br><span class="meta">${c.note}</span></dt><dd>${huf(c.amount)}</dd></div>`).join(''):`<div class="empty"><strong>Nincs rögzített kiadás</strong></div>`}</div></section>
          <section class="section"><div class="section-head"><h2>Nap típusa és bér</h2></div><div class="card" style="padding:14px"><div class="description-row"><dt>Nap típusa</dt><dd>Teljes nap · D</dd></div><div class="description-row"><dt>Napi alapbér</dt><dd>${huf(28000)}</dd></div><label style="margin-top:12px">Megjegyzés<textarea data-field="note">${state.note}</textarea></label></div></section>
          <section class="section"><div class="summary"><div class="summary-row"><span>Összes bevétel</span><strong>${huf(grossTotal())}</strong></div><div class="summary-row"><span>Kiadások</span><strong>− ${huf(costTotal())}</strong></div><div class="summary-row total"><span>Napi elszámolás</span><strong>${huf(grossTotal()-costTotal())}</strong></div></div><button class="btn primary" style="width:100%;margin-top:12px" data-action="submit-report" ${state.reportStatus==='submitted'?'disabled':''}>${state.reportStatus==='submitted'?'Jelentés beküldve':'Jelentés ellenőrzése és beküldése'}</button></section>
        </main>${nav()}`;
      }

      function reportDisclosure(item) {
        const open = state.openReports.includes(item.id);
        const count = countFor(item);
        return `<div class="disclosure"><button class="disclosure-head" data-action="toggle-report" data-id="${item.id}"><span><strong>${item.time} · ${item.label}</strong><small>${item.from} → ${item.to}</small></span><span class="amount">${huf(tripAmount(item))}</span><span>${open?'⌃':'⌄'}</span></button>${open?`<div class="disclosure-body">
          <dl class="description-list"><div class="description-row"><dt>Forrás</dt><dd>Beosztás · felülírható</dd></div><div class="description-row"><dt>Fizetés</dt><dd>${item.payment}</dd></div></dl>
          ${item.type==='carpool'?`<div class="description-row"><dt><strong>Tényleges utaslétszám</strong><br><span class="meta">Az indulás előtti levél alapján</span></dt><dd><div class="counter"><button data-action="count" data-id="${item.id}" data-delta="-1">−</button><strong>${count===null?'?':count}</strong><button data-action="count" data-id="${item.id}" data-delta="1">+</button></div></dd></div>${count===null?'<div class="alert" style="margin-top:10px">'+icons.alert+'<div><strong>Nincs utasadat</strong><p>Válaszd a 0 főt, ha nem volt utas, vagy add meg manuálisan a létszámot.</p></div></div>':''}`:`<div class="description-row"><dt>Utas / kapcsolattartó</dt><dd>${item.contact}</dd></div>`}
        </div>`:''}</div>`;
      }

      function vehicleView() {
        return `${header('Jármű', 'Aktív jármű és hibabejelentés')}<main class="content">
          <section class="card vehicle-selector"><span class="vehicle-icon">${icons.vehicle}</span><label><span>Mai beosztott jármű</span><select data-field="vehicle"><option value="v1">RTA-412 · Mercedes Vito</option><option value="v2">NMX-608 · Ford Tourneo</option><option value="other">Másik járművet használok…</option></select></label><span class="badge green">aktív</span></section>
          <section class="section"><div class="grid-2"><div class="stat"><span class="stat-label">Üzemanyag</span><strong>${SEED.vehicle.fuel}%</strong><div class="progress" style="margin-top:10px"><span style="width:${SEED.vehicle.fuel}%"></span></div></div><div class="stat"><span class="stat-label">Kilométeróra</span><strong>${new Intl.NumberFormat('hu-HU').format(SEED.vehicle.odometer)} km</strong></div></div></section>
          <section class="section"><div class="section-head"><h2>Webfleet kapcsolat</h2><span class="badge green">● online</span></div><div class="card" style="padding:14px"><div class="description-row"><dt>Jármű-hozzárendelés</dt><dd>Beosztásból átvéve</dd></div><div class="description-row"><dt>Utolsó szinkron</dt><dd>${SEED.vehicle.webfleet}</dd></div><p class="meta" style="margin-top:10px">A demó nem küld valódi Webfleet-parancsot. A production integráció külön pilotkapcsolatot igényel.</p></div></section>
          <section class="section"><div class="section-head"><h2>Nyitott hibák</h2><span class="badge amber">${state.issues.length} tétel</span></div><div class="card">${state.issues.map(issue=>`<div class="issue"><span class="issue-icon">${icons.alert}</span><div><strong>${issue.title}</strong><p>${issue.meta}</p></div><span class="badge amber">${issue.state}</span></div>`).join('')}</div></section>
          <section class="section"><button class="btn primary" style="width:100%" data-action="open-modal" data-modal="issue">Új járműhiba bejelentése</button><button class="btn" style="width:100%;margin-top:9px" data-action="open-modal" data-modal="unexpected-vehicle">Másik járművet használok</button></section>
        </main>${nav()}`;
      }

      function moneyView() {
        return `${header('Pénzügyi elszámolás', 'Napi bontás és becsült bér')}<main class="content">
          <section class="grid-2"><div class="stat"><span class="stat-label">Nálad lévő készpénz</span><strong>${huf(cashTotal())}</strong></div><div class="stat"><span class="stat-label">Napi nettó elszámolás</span><strong>${huf(grossTotal()-costTotal())}</strong></div></section>
          <section class="section"><div class="section-head"><h2>Mai bontás</h2><span class="badge green">egyezik</span></div><div class="card"><div class="description-row" style="padding:13px 14px"><dt>Transzferek</dt><dd>${huf(77000)}</dd></div><div class="description-row" style="padding:13px 14px"><dt>Telekocsik</dt><dd>${huf(tripAmount(trip('t2'))+tripAmount(trip('t4')))}</dd></div><div class="description-row" style="padding:13px 14px"><dt>Csomagpénz</dt><dd>${huf(state.packageIncome)}</dd></div><div class="description-row" style="padding:13px 14px"><dt>Kiadások</dt><dd>− ${huf(costTotal())}</dd></div></div></section>
          <section class="section"><div class="section-head"><h2>Korábbi napok</h2></div><div class="card">${SEED.history.map(row=>`<div class="description-row" style="padding:13px 14px"><dt><strong>${row.day}</strong><br><span class="badge ${row.status==='Jóváhagyva'?'green':'blue'}" style="margin-top:4px">${row.status}</span></dt><dd>${huf(row.total)}</dd></div>`).join('')}</div></section>
          <section class="section"><div class="card" style="padding:18px;color:#fff;background:linear-gradient(135deg,#1049a9,#1970f6);border:0"><p class="eyebrow" style="color:#ffd166">Becsült havi bér</p><div style="margin-top:8px;font-size:30px;font-weight:850">214 000 Ft</div><p style="margin:6px 0 0;color:#cfe0ff;font-size:12px">Alapbér + várakozás + jóváhagyott juttatások</p><div style="margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.22);font-size:11px;color:#dbe7ff">Tájékoztató becslés. A végleges összeget az iroda állapítja meg.</div></div></section>
        </main>${nav()}`;
      }

      function inboxView() {
        return `${header('Üzenetek', `${unreadCount()} olvasatlan értesítés`)}<main class="content">
          <div class="toolbar"><button class="filter active">Összes</button><button class="filter">Beosztás</button><button class="filter">Pénzügy</button><button class="filter">Jármű</button></div>
          <section class="section"><div class="card" style="overflow:hidden">${state.messages.map(message=>`<button class="message ${message.unread?'unread':''}" data-action="open-message" data-id="${message.id}"><span class="avatar">${message.from.split(' ')[0].slice(0,2).toUpperCase()}</span><span><strong>${message.title}</strong><span class="meta">${message.from} · ${message.time}</span><p>${message.body}</p></span>${message.unread?'<i class="unread-dot"></i>':'<span class="chevron">'+icons.chevron+'</span>'}</button>`).join('')}</div></section>
        </main>${nav()}`;
      }

      function render() {
        app.innerHTML = ({today:todayView,report:reportView,vehicle:vehicleView,money:moneyView,inbox:inboxView})[state.tab]();
        renderModal(); renderToast(); save();
      }

      function tripModal(item) {
        const count = countFor(item);
        const transfer = item.type !== 'carpool';
        return sheet(item.label, `<span class="badge ${badgeFor(item)}">${item.time} · ${statusLabel(item.id)}</span><p class="route">${item.from} → ${item.to}</p><p class="meta">${transfer?`${item.count} utas · ${item.contact}`:`${count===null?'Utaslétszám: nincs adat':count+' fő'} · 6000 Ft/fő`}</p>
          ${transfer?`<div class="flight"><span>✈</span><div><strong>${item.flight||'Nincs járatadat'}</strong><small>${item.type==='airport'?'Élő járatfigyelés mintája':'Üzleti transzfer'}</small></div><span class="delay">${item.flightState||''}</span></div><div class="button-row"><button class="btn" data-action="simulate" data-message="Hívás indítva: ${item.phone}">${icons.phone} ${item.phone}</button><button class="btn" data-action="simulate" data-message="Navigáció megnyitva">${icons.map} Navigáció</button></div><section class="section"><div class="section-head"><h2>Utaslista</h2><span class="badge gray">${item.passengers?.length||0} fő</span></div>${(item.passengers||[]).map(p=>`<div class="passenger"><span class="avatar">${p.name.split(' ').map(x=>x[0]).join('').slice(0,2)}</span><span><strong>${p.name}</strong><small>${p.note}</small></span><button class="icon-button" style="color:var(--brand);background:var(--brand-soft)" data-action="simulate" data-message="Hívás indítva: ${p.phone}">${icons.phone}</button></div>`).join('')}</section>`:`<div class="alert" style="margin-top:14px">${icons.alert}<div><strong>Telekocsi egyszerűsített nézet</strong><p>Nincs utasnév, telefonszám, navigáció vagy járatadat. Az utaslétszám indulás előtt manuálisan rögzíthető.</p></div></div><div class="description-row"><dt>Tényleges létszám</dt><dd><div class="counter"><button data-action="count" data-id="${item.id}" data-delta="-1">−</button><strong>${count===null?'?':count}</strong><button data-action="count" data-id="${item.id}" data-delta="1">+</button></div></dd></div>`}
          ${item.id==='t1'?`<button class="btn primary" style="width:100%;margin-top:14px" data-action="advance-trip" data-id="t1">${statusButton('t1')}</button>`:''}`);
      }

      function sheet(title, body) { return `<div class="overlay" data-action="close-modal"><section class="sheet" role="dialog" aria-modal="true" aria-label="${title}" data-stop><header class="sheet-head"><h2>${title}</h2><button class="close" data-action="close-modal" aria-label="Bezárás">${icons.close}</button></header><div class="sheet-body">${body}</div></section></div>`; }

      function renderModal() {
        if (!state.modal) { modalRoot.innerHTML=''; return; }
        if (state.modal.type==='trip') modalRoot.innerHTML = tripModal(trip(state.modal.id));
        if (state.modal.type==='message') {
          const m=state.messages.find(x=>x.id===state.modal.id);
          modalRoot.innerHTML=sheet(m.title, `<span class="badge blue">${m.from}</span><p class="meta" style="margin-top:8px">${m.time}</p><p style="line-height:1.65">${m.body}</p><button class="btn primary" style="width:100%;margin-top:12px" data-action="close-modal">Rendben</button>`);
        }
        if (state.modal==='demo') modalRoot.innerHTML=sheet('Demó beállítások', `<div class="alert">${icons.alert}<div><strong>Ez egy önálló szimulátor</strong><p>Minden művelet csak ebben a böngészőben változtatja a mintaállapotot.</p></div></div><button class="btn danger" style="width:100%;margin-top:16px" data-action="reset-demo">Demó visszaállítása alapállapotra</button>`);
        if (state.modal==='cost') modalRoot.innerHTML=sheet('Új kiadás', `<form class="form-grid" data-form="cost"><label>Kategória<select name="type"><option>Parkolás</option><option>Mosás</option><option>Reptéri behajtás</option><option>Tankolás</option><option>Egyéb</option></select></label><label>Összeg (Ft)<input name="amount" type="number" inputmode="numeric" min="0" placeholder="pl. 3000" required></label><label>Megjegyzés<input name="note" placeholder="pl. reptéri parkolás"></label><button class="btn primary" type="submit">Kiadás hozzáadása</button></form>`);
        if (state.modal==='package') modalRoot.innerHTML=sheet('Csomagpénz bevétel', `<form class="form-grid" data-form="package"><label>Összeg (Ft)<input name="amount" type="number" inputmode="numeric" min="0" value="${state.packageIncome}" required></label><label>Megjegyzés<input name="note" placeholder="pl. csomag Debrecenbe"></label><button class="btn primary" type="submit">Bevétel mentése</button></form>`);
        if (state.modal==='issue') modalRoot.innerHTML=sheet('Új járműhiba', `<form class="form-grid" data-form="issue"><label>Hiba típusa<select name="type"><option>Gumi / kerék</option><option>Karosszéria</option><option>Motor / műszerfal</option><option>Utastér</option><option>Egyéb</option></select></label><label>Súlyosság<select name="severity"><option>Alacsony</option><option selected>Közepes</option><option>Kritikus – nem indulok el</option></select></label><label>Leírás<textarea name="description" placeholder="Írd le röviden a hibát" required></textarea></label><label>Fotók (szimuláció)<input type="file" accept="image/*" multiple></label><button class="btn primary" type="submit">Hiba bejelentése</button></form>`);
        if (state.modal==='unexpected-vehicle') modalRoot.innerHTML=sheet('Másik jármű használata', `<div class="alert">${icons.alert}<div><strong>Irodai jóváhagyást igényel</strong><p>A váratlan járműcsere azonnal megjelenik a diszpécsernél.</p></div></div><form class="form-grid" data-form="vehicle"><label>Használt jármű<select name="vehicle"><option>NMX-608 · Ford Tourneo</option><option>AA-ZZ-123 · Külsős jármű</option></select></label><label>Indok<textarea name="reason" required placeholder="Miért kellett járművet cserélni?"></textarea></label><button class="btn primary" type="submit">Jóváhagyás kérése</button></form>`);
        if (state.modal==='add-trip') modalRoot.innerHTML=sheet('Fuvar hozzáadása', `<div class="grid-2"><button class="btn" data-action="simulate" data-message="Új transzfer űrlap megnyitva">+ Transzfer</button><button class="btn" data-action="simulate" data-message="Új telekocsi űrlap megnyitva">+ Telekocsi</button></div><p class="meta" style="margin-top:12px">A production változatban az új fuvar eltérésként kerül az irodai jóváhagyási sorba.</p>`);
      }

      function advanceTrip(id) {
        const steps=['assigned','to_pickup','arrived','onboard','completed'];
        const current=state.tripStatus[id]; const index=steps.indexOf(current);
        if (index>=0 && index<steps.length-1) state.tripStatus[id]=steps[index+1];
        showToast(statusLabel(id)); render();
      }

      document.addEventListener('click', event => {
        const stop=event.target.closest('[data-stop]');
        const control=event.target.closest('[data-action]');
        if (!control) return;
        if (control.dataset.action==='close-modal' && stop && control===event.target.closest('.overlay')) return;
        const action=control.dataset.action;
        if (action==='tab') { state.tab=control.dataset.tab; state.modal=null; window.scrollTo({top:0,behavior:'smooth'}); render(); }
        if (action==='open-modal') { state.modal=control.dataset.modal; renderModal(); }
        if (action==='close-modal') { state.modal=null; renderModal(); }
        if (action==='open-trip') { state.modal={type:'trip',id:control.dataset.id}; renderModal(); }
        if (action==='open-message') { const m=state.messages.find(x=>x.id===control.dataset.id); m.unread=false; state.modal={type:'message',id:m.id}; render(); }
        if (action==='advance-trip') advanceTrip(control.dataset.id);
        if (action==='dismiss-reminder') { state.reminderDismissed=true; showToast('Emlékeztető elrejtve'); render(); }
        if (action==='toggle-report') { const id=control.dataset.id; state.openReports=state.openReports.includes(id)?state.openReports.filter(x=>x!==id):[...state.openReports,id]; render(); }
        if (action==='count') { const id=control.dataset.id; const current=state.carpoolCounts[id]; const base=current===null?0:current; state.carpoolCounts[id]=Math.max(0,Math.min(8,base+Number(control.dataset.delta))); render(); }
        if (action==='submit-report') { state.reportStatus='submitted'; showToast('A napi jelentés beküldve az irodának'); render(); }
        if (action==='simulate') showToast(control.dataset.message || 'Szimulált művelet kész');
        if (action==='day') showToast('A kiválasztott nap mintaadatai megnyitva');
        if (action==='reset-demo') { state=clone(initialState); localStorage.removeItem('driver-demo-v1'); showToast('A demó visszaállt alapállapotra'); render(); }
      });

      document.addEventListener('change', event => {
        if (event.target.matches('[data-field="note"]')) { state.note=event.target.value; save(); }
        if (event.target.matches('[data-field="vehicle"]')) { state.vehicleId=event.target.value; if(event.target.value==='other'){state.modal='unexpected-vehicle';renderModal();} else {showToast('Jármű kiválasztva');save();} }
      });

      document.addEventListener('submit', event => {
        const form=event.target.closest('form[data-form]'); if(!form) return; event.preventDefault();
        const data=new FormData(form);
        if(form.dataset.form==='cost') state.costs.push({id:'c'+Date.now(),type:data.get('type'),amount:Number(data.get('amount')),note:data.get('note')||'Nincs megjegyzés'});
        if(form.dataset.form==='package') state.packageIncome=Number(data.get('amount'));
        if(form.dataset.form==='issue') state.issues.unshift({id:'i'+Date.now(),title:data.get('description'),meta:`${data.get('severity')} · Most bejelentve`,state:'Új'});
        state.modal=null; showToast(form.dataset.form==='issue'?'A járműhiba bejelentve':'Tétel mentve'); render();
      });

      render();
    </script>
  </body>
</html>
